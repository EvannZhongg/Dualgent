[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dualgent"
version = "0.1.0"
description = "An autonomous interaction agent for the web and desktop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
windows = ["uiautomation>=2.0.20,<3; sys_platform == 'win32'", "pywin32>=306; sys_platform == 'win32'", "psutil>=6,<8"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "playwright>=1.50,<2", "ruff>=0.9,<1"]

[project.scripts]
dualgent = "dualgent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dualgent = ["web/*", "extension/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = ["live: requires an API key and isolated browser or desktop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
